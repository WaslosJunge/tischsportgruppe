<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>xGem Fress-Alarm</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff7e0;--ink:#1b1b1b;--pink:#ffb3c7;--pink2:#ff8fb0;--red:#e5262b;--yellow:#ffd21f;--sky:#9fd8ff;--paper:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#1d1a14;--ink:#1b1b1b;--paper:#fff}.ui{color:#fff3d6}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Bangers,Impact,"Comic Sans MS",fantasy;letter-spacing:.04em;padding:16px;display:flex;flex-direction:column;align-items:center;gap:14px}
h1{margin:0;font-size:2rem;color:var(--red);-webkit-text-stroke:1.5px var(--ink);text-shadow:3px 3px 0 var(--ink);text-align:center}
.ui{font-size:1rem;text-align:center}
.tabs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tabs button{font:inherit;font-size:1.05rem;letter-spacing:.04em;padding:6px 12px;border:3px solid var(--ink);border-radius:10px;background:var(--yellow);color:var(--ink);cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.tabs button.on{background:var(--red);color:#fff}
.stage{width:100%;max-width:560px;border:5px solid var(--ink);border-radius:6px;background:var(--paper);box-shadow:6px 6px 0 var(--ink);overflow:hidden;position:relative}
.hud{display:flex;justify-content:space-between;align-items:center;background:var(--red);color:#fff;padding:6px 12px;font-size:1.15rem;border-bottom:5px solid var(--ink)}
.hud b{color:var(--yellow)}
svg{display:block;width:100%;height:auto}
.cap{background:var(--yellow);border-top:5px solid var(--ink);color:var(--ink);padding:8px 12px;font-size:1.35rem;text-align:center;min-height:3em;display:flex;align-items:center;justify-content:center}
.sk{stroke:var(--ink);stroke-width:5;stroke-linejoin:round;stroke-linecap:round}
.t{font-family:Bangers,Impact,"Comic Sans MS",fantasy;fill:var(--ink);letter-spacing:.04em}
.sfx{font-family:Bangers,Impact,fantasy;fill:var(--yellow);stroke:var(--ink);stroke-width:7;paint-order:stroke;stroke-linejoin:round;opacity:0;transform-box:fill-box;transform-origin:center}
.hide{opacity:0}
.pop{opacity:0;transform-box:fill-box;transform-origin:center}

/* ---------- gemeinsames Schwein ---------- */
.belly{transform-origin:180px 190px}
.pig{transform-origin:180px 252px}

/* ---------- Szene 1: Waage ---------- */
.play .s1 .pig{animation:s1drop .55s cubic-bezier(.5,0,1,.6) both, s1squash 1.4s 2.0s both}
@keyframes s1drop{0%{transform:translateY(-260px)}100%{transform:translateY(-26px)}}
@keyframes s1squash{0%{transform:translateY(-26px)}15%{transform:translateY(20px) scaleY(.82) scaleX(1.08)}100%{transform:translateY(20px) scaleY(.88) scaleX(1.05)}}
.play .s1 .needle{animation:s1needle .9s .55s ease-in both;transform-origin:320px 262px}
@keyframes s1needle{0%{transform:rotate(-70deg)}100%{transform:rotate(1500deg)}}
.play .s1 .dial{animation:s1dial .8s 2.0s ease-out both;transform-origin:320px 262px}
@keyframes s1dial{0%{transform:none;opacity:1}100%{transform:translate(150px,-210px) rotate(540deg);opacity:1}}
.play .s1 .spring{animation:s1spring 1.1s 2.0s ease-out both;transform-origin:150px 262px}
@keyframes s1spring{0%{transform:none}100%{transform:translate(-120px,-230px) rotate(-720deg)}}
.play .s1 .scalebase{animation:s1base .3s 2.0s both}
@keyframes s1base{to{transform:translateY(6px) skewX(8deg)}}
.play .s1 .sfx{animation:sfxpop .5s 2.0s both}
.play .s1 .bubble{animation:bpop .35s 2.9s both}

/* ---------- Szene 2: Hosenknopf ---------- */
.play .s2 .belly{animation:s2inflate 1.7s .3s ease-in-out both}
@keyframes s2inflate{0%{transform:scale(1)}30%{transform:scale(1.25)}40%{transform:scale(1.18)}70%{transform:scale(1.55)}80%{transform:scale(1.45)}100%{transform:scale(1.7)}}
.play .s2 .pig{animation:s2shake .12s 1.2s 6 alternate}
@keyframes s2shake{from{transform:translateX(-3px)}to{transform:translateX(3px)}}
.play .s2 .btn1{animation:hideAt 0s 2.0s both}
.play .s2 .btnfly{animation:s2fly .7s 2.0s cubic-bezier(.3,0,.9,.6) both;transform-origin:262px 195px}
@keyframes s2fly{0%{opacity:1;transform:scale(1)}60%{opacity:1;transform:translate(70px,-60px) scale(7)}100%{opacity:0;transform:translate(90px,-70px) scale(14)}}
.play .s2 .crack{animation:fadein .05s 2.65s both}
.play .s2 .flash{animation:s2flash .5s 2.65s both}
@keyframes s2flash{0%{opacity:0}8%{opacity:.9}100%{opacity:0}}
.play .s2 .sfx{animation:sfxpop .5s 2.65s both}
.play .s2 .bubble{animation:bpop .35s 3.3s both}
.play .s2 .face-in{animation:fadein .1s 1.2s both}

/* ---------- Szene 3: Trog ---------- */
.play .s3 .head{animation:s3munch .32s 0s 7 alternate, s3up .3s 2.3s both;transform-origin:255px 160px}
@keyframes s3munch{from{transform:rotate(22deg) translate(14px,22px)}to{transform:rotate(30deg) translate(14px,14px)}}
@keyframes s3up{to{transform:rotate(-8deg) translate(0,-6px)}}
.play .s3 .belly{animation:s3belly 2s both}
@keyframes s3belly{0%{transform:scale(1)}100%{transform:scale(1.5)}}
.play .s3 .slop{animation:s3slop .5s 0s 5 both}
@keyframes s3slop{0%{opacity:0;transform:translate(0,0)}30%{opacity:1}100%{opacity:0;transform:translate(var(--dx),-70px)}}
.play .s3 .burp{animation:s3burp 1.8s 2.5s ease-out both;transform-origin:280px 160px}
@keyframes s3burp{0%{opacity:0;transform:scale(.1)}20%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.6) translate(30px,-20px)}}
.play .s3 .sfx{animation:sfxpop .6s 2.6s both}
.play .s3 .bubble{animation:bpop .35s 3.4s both}

/* ---------- Szene 4: Erdbeben ---------- */
.play .s4 .lift{animation:s4lift .22s 1.65s ease-in both}
@keyframes s4lift{from{transform:translateY(-34px)}to{transform:translateY(0)}}
.play .s4 .wob{animation:s4wob .14s .2s 10 alternate;transform-origin:180px 252px}
@keyframes s4wob{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}
.play .s4 .pig{animation:s4sq .35s 1.8s both}
@keyframes s4sq{0%{transform:scale(1,1)}40%{transform:scale(1.12,.84)}100%{transform:scale(1,1)}}
.play .s4 .stool{animation:s4stool .3s 1.65s ease-in both;transform-origin:185px 254px}
@keyframes s4stool{0%{transform:none}100%{transform:scaleY(.25) skewX(14deg)}}
.play .s4 .world{animation:s4quake .09s 1.65s 14 alternate}
@keyframes s4quake{from{transform:translate(-4px,3px)}to{transform:translate(4px,-3px)}}
.play .s4 .crack{animation:s4crack .5s 1.7s ease-out both}
@keyframes s4crack{from{stroke-dashoffset:300}to{stroke-dashoffset:0}}
.play .s4 .dust{animation:s4dust 1.4s 1.7s ease-out both}
@keyframes s4dust{0%{opacity:0;transform:scale(.3)}30%{opacity:1}100%{opacity:0;transform:scale(1.8)}}
.play .s4 .sfx{animation:sfxpop .5s 1.7s both}
.play .s4 .sign{animation:bpop .35s 2.8s both}

/* ---------- Szene 5: Ballonschwein ---------- */
.play .s5 .belly{animation:s5inflate 1.4s .2s ease-in-out both, s5deflate .8s 2.4s ease-in both}
@keyframes s5inflate{0%{transform:scale(1)}100%{transform:scale(1.9)}}
@keyframes s5deflate{0%{transform:scale(1.9)}100%{transform:scale(.8)}}
.play .s5 .flyer{animation:s5fly 4.6s .2s linear both;transform-origin:180px 190px}
@keyframes s5fly{
 0%{transform:translate(0,0) rotate(0)}
 30%{transform:translate(0,-25px) rotate(0)}
 40%{transform:translate(70px,-60px) rotate(40deg)}
 52%{transform:translate(-40px,-85px) rotate(-70deg)}
 64%{transform:translate(70px,-50px) rotate(180deg)}
 76%{transform:translate(-20px,-15px) rotate(320deg)}
 100%{transform:translate(0,0) rotate(360deg)}}
.play .s5 .puff{animation:s5puff .9s var(--d) ease-out 1 both}
@keyframes s5puff{0%{opacity:0;transform:scale(.2)}20%{opacity:.9}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(2.2)}}
.play .s5 .sfx{animation:sfxpop .5s 1.8s both}
.play .s5 .sfx2{animation:sfxpop .5s 4.7s both}
.play .s5 .bubble{animation:bpop .35s 3.9s both}

/* ---------- gemeinsam ---------- */
@keyframes sfxpop{0%{opacity:0;transform:scale(.2) rotate(-12deg)}30%{opacity:1;transform:scale(1.25) rotate(-6deg)}100%{opacity:1;transform:scale(1) rotate(-6deg)}}
@keyframes bpop{0%{opacity:0;transform:scale(.6)}100%{opacity:1;transform:scale(1)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes hideAt{to{opacity:0}}
.bubble{opacity:0;transform-box:fill-box;transform-origin:50% 100%}
.crack{opacity:0}
.flash{opacity:0}
.play .s2 .crack{opacity:1}
.play .s4 .crack{opacity:1}
.s4 .crack{stroke-dasharray:300}
.fx-hidden{display:none}
</style>
</head>
<body>
<h1>xGem · Fress-Alarm</h1>
<div class="ui">5 Clips · je ca. 5 Sekunden · Pixel? Nein. Reines SVG/CSS, kein Videofile.</div>
<div class="tabs" id="tabs"></div>
<div class="stage">
  <div class="hud"><span>TAGESLIMIT: <b>2.000 kcal</b></span><span>HEUTE: <b>3.847 kcal</b></span></div>
  <div id="view"></div>
  <div class="cap" id="cap"></div>
</div>
<div class="tabs"><button id="again">↻ Nochmal</button><button id="auto">▶ Alle nacheinander</button></div>

<script>
const INK='#1b1b1b',PINK='#ffb3c7',PINK2='#ff8fb0';
const sk='class="sk"';

function pig({pants=false,eyes='wide'}={}){
return `
<g class="pig">
  <g class="tail"><path ${sk} d="M112 178 q-26 -6 -16 -24 q10 -10 18 2 q4 10 -8 12" fill="none"/></g>
  <rect ${sk} x="132" y="222" width="28" height="32" rx="9" fill="${PINK2}"/>
  <rect ${sk} x="206" y="222" width="28" height="32" rx="9" fill="${PINK2}"/>
  <g class="belly">
    <ellipse ${sk} cx="180" cy="190" rx="72" ry="56" fill="${PINK}"/>
    <ellipse cx="150" cy="170" rx="20" ry="10" fill="#fff" opacity=".45" transform="rotate(-25 150 170)"/>
    ${pants?`<path ${sk} d="M112 214 q68 34 136 0 l-6 -20 q-62 22 -124 0z" fill="#3b82f6"/><circle class="sk btn1" cx="236" cy="204" r="8" fill="${'#ffd21f'}"/>`:''}
  </g>
  <g class="head">
    <path ${sk} d="M232 120 l8 -34 l24 22z" fill="${PINK2}"/>
    <circle ${sk} cx="262" cy="150" r="42" fill="${PINK}"/>
    <ellipse ${sk} cx="294" cy="162" rx="20" ry="15" fill="${PINK2}"/>
    <ellipse cx="288" cy="162" rx="3.5" ry="6" fill="${INK}"/><ellipse cx="302" cy="162" rx="3.5" ry="6" fill="${INK}"/>
    ${eyes==='closed'
      ?`<path ${sk} d="M262 138 q10 -9 20 0" fill="none"/>`
      :`<circle ${sk} cx="274" cy="138" r="11" fill="#fff"/><circle cx="277" cy="139" r="4.5" fill="${INK}"/>`}
    <path ${sk} d="M270 184 q12 8 24 -2" fill="none"/>
  </g>
</g>`;
}
function bubble(x,y,w,txt,tailX=0){
 const h=44;
 return `<g class="bubble"><path ${sk} fill="#fff" d="M${x} ${y} h${w} a14 14 0 0 1 14 14 v${h-28} a14 14 0 0 1 -14 14 h-${w-(tailX||40)-20} l-14 18 l2 -18 h-${tailX||40} a14 14 0 0 1 -14 -14 v-${h-28} a14 14 0 0 1 14 -14z" transform="translate(0,0)"/>
 <text class="t" x="${x+w/2}" y="${y+h/2+4}" text-anchor="middle" font-size="22">${txt}</text></g>`;
}
const sfx=(x,y,txt,size=54,cls='')=>`<text class="sfx ${cls}" x="${x}" y="${y}" text-anchor="middle" font-size="${size}">${txt}</text>`;
const ground=`<rect x="-20" y="254" width="440" height="66" fill="#9ad66b"/><path ${sk} d="M-5 254 H405" fill="none"/>`;
const sky=(c='#bfe6ff')=>`<rect x="-20" y="-20" width="440" height="340" fill="${c}"/>`;

const scenes=[
{ name:'1 · Waage kündigt', cap:'Die Waage hat gekündigt. Fristlos.',
  svg:()=>`<svg viewBox="0 0 400 300" class="s1">${sky()}${ground}
  <g class="scalebase"><rect ${sk} x="90" y="250" width="260" height="14" rx="5" fill="#8a8a8a"/></g>
  <g class="spring"><path ${sk} fill="none" d="M150 250 q-10 -6 0 -12 q10 -6 0 -12 q-10 -6 0 -12"/></g>
  <g class="dial"><circle ${sk} cx="320" cy="262" r="30" fill="#fff"/><g class="needle"><path ${sk} d="M320 262 L320 240" /></g></g>
  ${pig({eyes:'wide'})}
  ${sfx(250,130,'KRACH!',66)}
  ${bubble(24,14,250,'„Ich sag nur: 3 Schnitzel.“',70)}
  <text class="t" x="320" y="105" font-size="1" opacity="0">.</text>
  </svg>` },

{ name:'2 · Hosenknopf-Geschoss', cap:'Bauch an: Hosenknopf aus. Kopf in Deckung!',
  svg:()=>`<svg viewBox="0 0 400 300" class="s2">${sky('#ffe4a8')}${ground}
  ${pig({pants:true})}
  <g class="btnfly" style="opacity:0"><circle ${sk} cx="262" cy="195" r="8" fill="#ffd21f"/></g>
  <rect class="flash" width="400" height="300" fill="#fff"/>
  <g class="crack"><path ${sk} stroke-width="4" fill="none" d="M310 80 L280 50 L292 28 M280 50 L240 44 M310 80 L346 60 L350 30 M346 60 L388 70 M310 80 L296 112 L318 140 M296 112 L262 124"/></g>
  ${sfx(300,130,'PING!',72)}
  ${bubble(14,14,215,'„Nur der Knopf. Ehrlich.“',90)}
  </svg>` },

{ name:'3 · Trog-Sau', cap:'Gesichtsvoran in den Trog. Würde? Nie gehört.',
  svg:()=>`<svg viewBox="0 0 400 300" class="s3">${sky('#d9f0c4')}${ground}
  <path ${sk} fill="#a66a3a" d="M290 214 h95 l-12 40 h-71z"/>
  <path d="M296 220 h82 v8 h-82z" fill="#7a4a1f"/>
  ${[['-30px',0],['10px',.12],['40px',.25],['-5px',.35],['25px',.45]].map(([dx,d])=>`<circle class="slop" cx="320" cy="214" r="${6+Math.random()*4}" fill="#8a5a2b" ${sk} style="--dx:${dx};animation-delay:${d}s;opacity:0"/>`).join('')}
  ${pig({eyes:'wide'})}
  <g class="burp"><path ${sk} transform="translate(-45,18) scale(.9)" fill="#b7e07a" d="M300 150 q-30 -30 0 -40 q10 -30 40 -20 q30 -10 40 20 q30 10 10 40 q-10 30 -40 20 q-20 20 -50 0 q-30 -5 0 -20z"/></g>
  ${sfx(285,92,'BÖÖÖRP!',52)}
  ${bubble(24,24,200,'„Hab ich Nachschlag?“',40)}
  </svg>` },

{ name:'4 · Erdbeben-Stuhl', cap:'Magnitude 5,2. Epizentrum: dein Hintern.',
  svg:()=>`<svg viewBox="0 0 400 300" class="s4"><g class="world">${sky('#ffd9d9')}${ground}
  <path class="sk crack" fill="none" d="M110 262 l22 12 l-14 12 l34 12 M250 262 l30 14 l-20 10 l34 16"/>
  <g class="stool"><rect ${sk} x="120" y="220" width="130" height="14" rx="4" fill="#c28a4a"/><rect ${sk} x="130" y="234" width="12" height="20" fill="#c28a4a"/><rect ${sk} x="228" y="234" width="12" height="20" fill="#c28a4a"/></g>
  <g class="lift"><g class="wob">${pig({eyes:'wide'})}</g></g>
  <g class="dust"><circle ${sk} cx="100" cy="246" r="22" fill="#e6d9bd"/><circle ${sk} cx="262" cy="248" r="26" fill="#e6d9bd"/><circle ${sk} cx="185" cy="256" r="18" fill="#e6d9bd"/></g>
  ${sfx(285,70,'KRAAAK!',62)}
  <g class="sign"><rect ${sk} x="14" y="14" width="150" height="62" fill="#fff"/><text class="t" x="89" y="40" text-anchor="middle" font-size="22">ACHTUNG:</text><text class="t" x="89" y="66" text-anchor="middle" font-size="22">Fresse-Beben!</text></g>
  </g></svg>` },

{ name:'5 · Ballon-Schwein', cap:'Zu viel Luft, zu viel Wurst. Abflug per Pups.',
  svg:()=>`<svg viewBox="0 0 400 300" class="s5">${sky('#c9ecff')}
  <circle cx="320" cy="50" r="26" fill="#ffe14d" ${sk}/>
  ${ground}
  ${[0,1,2,3,4,5].map(i=>`<circle class="puff" ${sk} cx="${130+i*22}" cy="${200-i*18}" r="14" fill="#b7e07a" style="--d:${(1.5+i*.3).toFixed(2)}s;--dx:${i%2?-60:60}px;--dy:30px;opacity:0"/>`).join('')}
  <g class="flyer">${pig({eyes:'closed'})}</g>
  ${sfx(120,140,'PFFFRRRT!',54)}
  ${sfx(200,235,'PLOPP.',60,'sfx2')}
  ${bubble(14,12,300,'„Ich bin kein Schwein, ich bin Luft!“',60)}
  </svg>` }
];

let cur=0,timer=null,auto=false;
const view=document.getElementById('view'),cap=document.getElementById('cap'),tabs=document.getElementById('tabs');
scenes.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s.name;b.onclick=()=>{auto=false;play(i)};tabs.appendChild(b)});
function play(i){
  clearTimeout(timer);cur=i;
  [...tabs.children].forEach((b,j)=>b.classList.toggle('on',j===i));
  view.className='';view.innerHTML=scenes[i].svg();cap.textContent=scenes[i].cap;
  void view.offsetWidth;view.className='play';
  timer=setTimeout(()=>{ if(auto) play((cur+1)%scenes.length) },5600);
}
document.getElementById('again').onclick=()=>play(cur);
document.getElementById('auto').onclick=()=>{auto=true;play(0)};
play(0);
</script>
</body>
</html>
